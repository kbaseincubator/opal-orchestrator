[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-orchestrator"
version = "0.1.0"
description = "OPAL Orchestration Chatbot - Cross-lab resource utilization planning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OPAL Team"}
]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "chromadb>=1.5.9",
    "anthropic>=2.3.0",
    "openai>=3.39.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "beautifulsoup4>=4.15.0",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
]

[project.scripts]
opal-ingest = "cli.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]
